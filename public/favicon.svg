<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="12" fill="#0a0d14"/>
  <!-- Base -->
  <rect x="24" y="54" width="16" height="4" rx="2" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <rect x="27" y="48" width="10" height="7" rx="1" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <!-- Shoulder joint -->
  <circle cx="32" cy="46" r="4" stroke="#38bdf8" stroke-width="2" fill="#0a0d14"/>
  <!-- Upper arm -->
  <line x1="32" y1="42" x2="22" y2="28" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Elbow joint -->
  <circle cx="22" cy="27" r="3.5" stroke="#38bdf8" stroke-width="2" fill="#0a0d14"/>
  <!-- Forearm -->
  <line x1="24" y1="25" x2="38" y2="14" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Wrist joint -->
  <circle cx="39" cy="13" r="3" stroke="#38bdf8" stroke-width="2" fill="#0a0d14"/>
  <!-- Tool -->
  <line x1="41" y1="11" x2="48" y2="8" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="49" cy="7.5" r="1.5" fill="#38bdf8"/>
  <!-- Glow accent dot -->
  <circle cx="49" cy="7.5" r="3" fill="#38bdf8" fill-opacity="0.2"/>
</svg>